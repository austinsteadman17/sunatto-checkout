<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Southern Energy Distributors — Secure Payment</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..600&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="sunatto.css" />
<script src="https://js.stripe.com/v3/"></script>
<style>
  /* checkout.html only — everything else comes from sunatto.css.

     NOTE: <html> is pinned to data-theme="light" on purpose. Stripe
     Elements renders the card/bank fields inside its own iframe using
     Stripe's default light theme, and page CSS cannot reach inside it.
     Following the system dark preference here would wrap a bright white
     payment form in a dark page — which on a page asking for card details
     reads as broken rather than intentional. To support dark properly,
     checkout.js would also need to pass a matching `appearance` to
     stripe.elements(); until then, light everywhere is the honest option. */

  .wrap { max-width: 480px; }

  /* Surcharge breakdown rows. */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .row.total {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.02em;
    border-top: 1px solid var(--hairline);
    margin-top: var(--sp-1);
    padding-top: var(--sp-3);
  }

  .locked-amount a { color: var(--muted-foreground); text-decoration: underline; }

  /* Manual-amount entry (custom payment links). */
  input.amount-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 11px 14px 11px 28px;
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
    outline: none;
    box-shadow: var(--shadow-1);
    transition: border-color var(--dur-fast) var(--ease-ios),
                box-shadow var(--dur-fast) var(--ease-ios);
  }
  input.amount-input:focus {
    border-color: color-mix(in oklab, var(--foreground) 30%, transparent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 25%, transparent);
  }
  input.amount-input:disabled { background: var(--surface-2); color: var(--muted-foreground); }

  #payment-element { margin: var(--sp-4) 0; }

  /* Checkout buttons are full-width and stacked, so they're styled by id
     here rather than reusing the hub's .primary/.secondary classes. */
  button {
    width: 100%;
    padding: 13px;
    border-radius: 999px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: var(--sp-2);
    font-family: inherit;
    transition: transform var(--dur-fast) var(--ease-ios),
                box-shadow var(--dur-med) var(--ease-ios);
  }
  button:active { transform: scale(0.97); }
  #continue-button, #confirm-button, #amount-continue-button {
    background: var(--primary);
    color: var(--primary-foreground);
    box-shadow: var(--shadow-2);
  }
  #continue-button:hover:not(:disabled),
  #confirm-button:hover:not(:disabled),
  #amount-continue-button:hover:not(:disabled) { box-shadow: var(--shadow-3); }
  #continue-button:disabled, #confirm-button:disabled, #amount-continue-button:disabled {
    background: var(--surface-2);
    color: var(--muted-foreground);
    box-shadow: none;
    cursor: not-allowed;
  }
  #amount-continue-button { margin-bottom: var(--sp-4); }
  #back-button {
    background: var(--card);
    border: 1px solid var(--hairline);
    color: var(--foreground);
    box-shadow: var(--shadow-1);
  }

  /* The legally-required surcharge disclosure. Deliberately the loudest
     thing on the page after the amount — it must not get quieter. */
  .surcharge-note {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--brand-ink);
    background: var(--gold-light);
    border: 1px solid color-mix(in oklab, var(--brand) 45%, transparent);
    border-radius: var(--radius-2xl);
    padding: 12px 14px;
    margin: var(--sp-2) 0;
  }

  #breakdown-screen, #success-screen, #manual-amount-block, #locked-amount-block, #payment-form {
    display: none;
  }

  #success-screen { text-align: center; }
  .success-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--green-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto var(--sp-4);
    color: var(--success-ink);
  }
  #success-screen h2 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 var(--sp-1);
  }
  #success-detail { color: var(--muted-foreground); font-size: 13px; line-height: 1.55; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="sed-logo.png" alt="Southern Energy Distributors" />
      <span>Southern Energy Distributors</span>
    </div>

    <div class="card">
      <!-- Step 1: amount + payment details -->
      <div id="entry-screen">
        <div class="eyebrow" id="page-eyebrow">Payment</div>
        <h1>Amount Due</h1>
        <div class="subtitle" id="page-subtitle"></div>

        <div id="locked-amount-block" class="locked-amount">
          <span class="label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span id="locked-amount-caption">Amount set by Southern Energy Distributors</span>
          </span>
          <span class="value" id="locked-amount-value">$0.00</span>
        </div>

        <div id="manual-amount-block">
          <label class="field-label" for="amount-field">Amount</label>
          <div class="amount-input-group">
            <span class="prefix">$</span>
            <input type="text" inputmode="decimal" id="amount-field" class="amount-input" placeholder="0.00" />
          </div>
          <button id="amount-continue-button" type="button">Continue</button>
        </div>

        <form id="payment-form">
          <div id="payment-element"></div>
          <button id="continue-button" type="submit">Continue</button>
        </form>
        <div class="error-message" id="error-message"></div>
      </div>

      <!-- Step 2: breakdown + explicit confirmation (required disclosure step) -->
      <div id="breakdown-screen">
        <div class="eyebrow">Confirm Payment</div>
        <h1>Review &amp; Pay</h1>
        <div class="subtitle" id="breakdown-subtitle"></div>

        <div class="row"><span>Subtotal</span><span id="bd-subtotal"></span></div>
        <div class="row" id="bd-surcharge-row" style="display:none;"><span id="bd-surcharge-label">Card surcharge (3%)</span><span id="bd-surcharge"></span></div>
        <div class="row total"><span>Total</span><span id="bd-total"></span></div>
        <div class="surcharge-note" id="surcharge-note" style="display:none;">
          A 3% surcharge applies to credit card payments. Paying by bank account (ACH) or debit card has no surcharge.
        </div>
        <button id="confirm-button">Confirm and Pay</button>
        <button id="back-button">Use a different payment method</button>
        <div class="error-message" id="error-message-2"></div>
      </div>

      <!-- Step 3: result -->
      <div id="success-screen">
        <div class="success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <h2>Payment received</h2>
        <p id="success-detail"></p>
      </div>
    </div>

    <div class="footnote" id="footnote"></div>
  </div>

  <script src="checkout.js"></script>
</body>
</html>
